# config.yaml
# Configuration for Zebrafish Behavior Classification

data:
  window_size: 150
  fps: 5
  num_classes: 15

model:
  input_dim: 4096
  hidden_dim: 256
  num_layers: 2
  dropout: 0.3

training:
  epochs: 50
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.001
  label_smoothing: 0.1